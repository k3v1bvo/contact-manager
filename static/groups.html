
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos - Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Contact Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/persons.html">Personas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/groups.html">Grupos</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Lista de Grupos</h2>
        <button class="btn btn-success mb-3" onclick="location.href='/group-form.html?new=true'">Nuevo Grupo</button>
        <table class="table table-striped" id="groups-table">
            <thead><tr><th>Código</th><th>Nombre</th><th>Acciones</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadGroups() {
            const resp = await fetch('/api/groups');
            const groups = await resp.json();
            const tbody = document.querySelector('#groups-table tbody');
            tbody.innerHTML = '';
            groups.forEach(g => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = g.code.slice(0,8)+'...';
                row.insertCell(1).textContent = g.group;
                const actions = row.insertCell(2);
                actions.innerHTML = `<button class="btn btn-sm btn-warning" onclick="location.href='/group-form.html?code=${g.code}'">Editar</button>
                                     <button class="btn btn-sm btn-danger" onclick="deleteGroup('${g.code}')">Eliminar</button>`;
            });
        }
        async function deleteGroup(code) {
            if (confirm('¿Eliminar este grupo?')) {
                await fetch(`/api/groups/${code}`, { method: 'DELETE' });
                loadGroups();
            }
        }
        loadGroups();
    </script>
</body>
</html>
